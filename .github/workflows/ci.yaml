name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-xero-mcp-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the repo; it never needs to write back or use elevated scopes.
permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript build
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: npm audit (fail on HIGH+ in production deps)
        # Gate on what ships to the runtime image. Dev-only advisories
        # (build tools, linters) never reach production, so they must not
        # block a security deploy — they still get Dependabot PRs for
        # visibility. Also avoids the all-or-nothing deadlock where one
        # dev-tool advisory with no fix wedges every PR red.
        run: npm audit --omit=dev --audit-level=high

      # Enforce the hosted-deployment filesystem guard so a future refactor
      # (renaming the disable flag, simplifying childEnv) can't silently reopen
      # the secret-read / file-write holes this protects against.
      - name: Verify dependency overrides
        # package.json pins brace-expansion into the @google-cloud/secret-manager chain to
        # clear a HIGH advisory, and axios (xero-node's transport) for the same reason.
        # The brace-expansion pin is load-bearing: the 5.x line drops the `default` export
        # minimatch@9 calls, so a wrong version makes `npm audit` report zero while
        # silently breaking glob inside the path that reads every user's refresh token.
        # Invisible to lint and build; this asserts it at require() time.
        run: npm run verify:deps

      - name: Verify auth 401 recovery
        # The reauth Proxy over accountingApi/payrollNZApi. Its critical property — that
        # setAccessToken() still writes THROUGH the Proxy — is invisible to tsc: a wrong
        # trap would silently stop every token refresh taking effect.
        run: npm run verify:auth-recovery

      - name: Verify attachment filesystem guard
        run: npm run verify:fs-guard

      # Enforce that the transport stays STATELESS (issues no mcp-session-id) and
      # the per-user child pool keeps users isolated. This is what makes instance
      # replacement invisible; a refactor that reintroduced session state would
      # bring back the 404-on-recycle disconnect this guards against.
      - name: Verify stateless MCP transport + child pool
        run: npm run verify:stateless

      # Guard against the empty-schema regression: every tool must publish a
      # non-empty input schema. If a refactor or SDK change ever makes the SDK
      # misread a tool's Zod raw shape and fall back to {"type":"object"} with no
      # properties, clients silently stringify all arguments and confirmed writes
      # break with no error. This asserts the published schemas directly.
      - name: Verify tool input schemas are non-empty
        run: npm run verify:schemas

      # Enforce the write-confirmation gate: write tools expose `confirm` and
      # return a preview until confirm:true; read tools never expose `confirm`.
      - name: Verify write-confirmation gate
        run: npm run verify:confirmation-gate

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build container image (no push)
        run: docker build --pull -t xero-mcp-server:ci-${{ github.sha }} .

      - name: Smoke-test the image
        run: |
          # Unique name + an EPHEMERAL host port. Both used to be fixed
          # (`--name <svc>-smoke -p 18080:8080`), so two runs overlapping on the
          # self-hosted runner collided and one failed with
          # 'container name is already in use' or a port bind error — a flake that
          # looked like the PR's fault. Observed on hubspot-custom-mcp#49.
          CTR=xero-mcp-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          trap 'docker rm -f "$CTR" >/dev/null 2>&1 || true' EXIT
          # Boot the container with fake env, confirm:
          #   1. it stays running for >5s
          #   2. /healthz responds 200 (proves the express server is up)
          docker run -d --name "$CTR" -p 0:8080 \
            -e PUBLIC_URL=http://localhost:8080 \
            -e GCP_PROJECT=ci-smoke \
            -e XERO_APP_CLIENT_ID=ci-smoke \
            -e XERO_APP_CLIENT_SECRET=ci-smoke \
            -e MCP_JWT_SECRET=ci-smoke-secret-do-not-trust \
            xero-mcp-server:ci-${{ github.sha }}
          PORT=$(docker port "$CTR" 8080/tcp | head -1 | sed 's/.*://')
          echo "smoke container $CTR on host port $PORT"
          sleep 5
          STATE=$(docker inspect -f '{{.State.Status}}' "$CTR")
          if [ "$STATE" != "running" ]; then
            echo "::error::container is in state '$STATE' after 5s"
            docker logs "$CTR"
            docker rm -f "$CTR"
            exit 1
          fi
          if ! curl -fsS --max-time 5 http://localhost:$PORT/healthz | grep -q '"ok"'; then
            echo "::error::/healthz did not return ok"
            docker logs "$CTR"
            docker rm -f "$CTR"
            exit 1
          fi
          echo "Container is running and /healthz returns ok."
          docker rm -f "$CTR"
