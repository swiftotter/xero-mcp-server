name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing image tag to roll out (skips the build — use for rollbacks). Defaults to building the current commit.'
        required: false
        type: string

concurrency:
  group: deploy-xero-mcp
  cancel-in-progress: false

# Least privilege for the workflow token: only repo read is needed (checkout +
# step summaries). GCP access comes from the SA credential, not GITHUB_TOKEN.
permissions:
  contents: read

env:
  GCP_PROJECT: internal-mcps-496022
  GCP_REGION: us-central1
  ARTIFACT_REPO: xero-mcp
  IMAGE_NAME: server
  SERVICE_NAME: xero-mcp

# SECURITY: both deploy jobs read secrets.GCP_SA_KEY (a long-lived SA JSON key).
# Repo-level secrets are readable by a workflow on ANY branch, so anyone who can
# push a branch could add a workflow that exfiltrates the key or deploys a
# backdoored image — bypassing the merge-to-main gate. Binding the jobs to the
# `production` GitHub Environment lets that exposure be closed in repo settings:
#   1. Settings > Environments > production: add a deployment-branch rule
#      limiting it to `main` (and, ideally, required reviewers).
#   2. Move GCP_SA_KEY from a repo secret to a `production` environment secret.
#   3. Better still, replace the static key with keyless Workload Identity
#      Federation (google-github-actions/auth with workload_identity_provider)
#      scoped to repo:swiftotter/xero-mcp-server:ref:refs/heads/main.
jobs:
  build-and-push:
    name: Build & push image
    # GitHub-hosted on purpose (public repo; see CLAUDE.md). `ubuntu-latest` can
    # change Docker under this job at any time, which is why the digest is read
    # back from the registry (scripts/image-platform-digest.sh).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    outputs:
      image: ${{ steps.image-ref.outputs.image }}
      registry: ${{ steps.image-ref.outputs.registry }}
      digest: ${{ steps.push.outputs.digest || steps.existing.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve image tag
        id: image-ref
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          TAG="${INPUT_TAG}"
          if [ -z "${TAG}" ]; then TAG="${GITHUB_SHA::12}"; fi
          if ! [[ "${TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::image_tag is not a valid Docker tag"
            exit 1
          fi
          REGISTRY="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${ARTIFACT_REPO}/${IMAGE_NAME}"
          {
            echo "image=${REGISTRY}:${TAG}"
            echo "image_latest=${REGISTRY}:latest"
            echo "tag=${TAG}"
            echo "registry=${REGISTRY}"
          } >> "$GITHUB_OUTPUT"

      # Both paths read the image's digest from the registry, so both need auth.
      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      # inputs.image_tag is null on push events, and null == '' is true in
      # Actions expressions — so the build path runs on every push to main,
      # and only an explicit dispatch tag (rollback) skips it.
      #
      # The digest is read back from the registry (the deploy SA cannot call
      # `gcloud artifacts docker images describe`: it drags in
      # containeranalysis.occurrences.list, which the SA lacks by design), as the
      # linux/amd64 manifest Cloud Run will run, not whatever the local Docker
      # reports.
      - name: Build and push image
        if: ${{ inputs.image_tag == '' }}
        id: push
        env:
          IMAGE: ${{ steps.image-ref.outputs.image }}
          IMAGE_LATEST: ${{ steps.image-ref.outputs.image_latest }}
        run: |
          docker build --platform linux/amd64 -t "${IMAGE}" -t "${IMAGE_LATEST}" .
          docker push "${IMAGE}"
          docker push "${IMAGE_LATEST}"
          DIGEST=$(scripts/image-platform-digest.sh "${IMAGE}")
          echo "Pushed digest (linux/amd64 manifest): ${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Verify existing image (rollback path)
        if: ${{ inputs.image_tag != '' }}
        id: existing
        env:
          IMAGE: ${{ steps.image-ref.outputs.image }}
        run: |
          # `gcloud artifacts docker images list` returns the TAG's digest, which
          # for a manifest list is not the digest Cloud Run runs. Resolve it the
          # same way as the build path so the verify step compares like with like.
          if ! DIGEST=$(scripts/image-platform-digest.sh "${IMAGE}"); then
            echo "::error::image ${IMAGE} not found or has no linux/amd64 manifest"
            exit 1
          fi
          echo "Rolling back to ${IMAGE} (${DIGEST})"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Build summary
        env:
          TAG: ${{ steps.image-ref.outputs.tag }}
          IMAGE: ${{ steps.image-ref.outputs.image }}
          INPUT_TAG: ${{ inputs.image_tag }}
          DIGEST: ${{ steps.push.outputs.digest || steps.existing.outputs.digest }}
        run: |
          {
            if [ -n "${INPUT_TAG}" ]; then
              echo "## Existing image verified (rollout only)"
            else
              echo "## Image built"
            fi
            echo ""
            echo "- **Tag:** \`${TAG}\`"
            echo "- **Image:** \`${IMAGE}\`"
            echo "- **Digest (linux/amd64):** \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  rollout:
    name: Roll out the shared xero-mcp service
    needs: build-and-push
    runs-on: ubuntu-latest
    # Room for a rollback: two rollouts plus two smoke runs. A timeout mid-smoke
    # cancels the job, and failure() is false on cancel, so no rollback would run.
    timeout-minutes: 20
    environment: production
    steps:
      # For the smoke scripts below (dependency-free, so no npm ci). First, so its
      # workspace clean can't touch the GCP credentials file the auth step writes.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      # What to roll back to if the smoke test fails: the digest-pinned image of
      # the revision serving right now. A failed lookup fails the job BEFORE the
      # update — never deploy without a rollback target, since a silently empty
      # one would skip the rollback and leave a bad deploy live.
      - name: Record the currently serving image
        id: prev
        run: |
          # The revision taking the most traffic, not latestReadyRevisionName:
          # those differ if someone pinned traffic by hand.
          SERVICE_JSON=$(gcloud run services describe "${SERVICE_NAME}" \
            --project="${GCP_PROJECT}" \
            --region="${GCP_REGION}" \
            --format=json)
          PREV_REVISION=$(jq -r '[.status.traffic[]? | select(.revisionName != null)] | max_by(.percent) | .revisionName // empty' <<<"${SERVICE_JSON}")
          PREV_IMAGE=""
          if [ -n "${PREV_REVISION}" ]; then
            PREV_IMAGE=$(gcloud run revisions describe "${PREV_REVISION}" \
              --project="${GCP_PROJECT}" \
              --region="${GCP_REGION}" \
              --format="value(spec.containers[0].image)")
          fi
          if [ -z "${PREV_IMAGE}" ]; then
            echo "::warning::No serving revision found; this deploy has no rollback target."
          fi
          echo "Currently serving: ${PREV_REVISION:-none} ${PREV_IMAGE}"
          {
            echo "revision=${PREV_REVISION}"
            echo "image=${PREV_IMAGE}"
          } >> "$GITHUB_OUTPUT"

      - name: Update Cloud Run service to new image
        id: update
        env:
          # Deployed by digest, not tag: the revision runs exactly the manifest the
          # Verify step expects, and a tag moved in between can't change it.
          IMAGE: ${{ needs.build-and-push.outputs.registry }}@${{ needs.build-and-push.outputs.digest }}
        run: |
          gcloud run services update "${SERVICE_NAME}" \
            --project="${GCP_PROJECT}" \
            --region="${GCP_REGION}" \
            --image="${IMAGE}" \
            --quiet

      - name: Verify rollout
        id: verify
        env:
          EXPECTED_IMAGE: ${{ needs.build-and-push.outputs.image }}
          EXPECTED_DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          SERVICE_JSON=$(gcloud run services describe "${SERVICE_NAME}" \
            --project="${GCP_PROJECT}" \
            --region="${GCP_REGION}" \
            --format=json)
          LATEST_REVISION=$(jq -r '.status.latestReadyRevisionName' <<<"${SERVICE_JSON}")
          # The URL the service advertises (its PUBLIC_URL, set by scripts/deploy-shared.sh), not status.url:
          # Cloud Run gives a service two valid URLs, and the smoke test checks the OAuth metadata names this one.
          SERVICE_URL=$(jq -r '((.spec.template.spec.containers[0].env // []) | map(select(.name == "PUBLIC_URL")) | .[0].value) // .status.url' <<<"${SERVICE_JSON}")
          PERCENT=$(jq -r --arg rev "${LATEST_REVISION}" \
            '[.status.traffic[] | select(.revisionName == $rev or .latestRevision == true) | .percent] | add // 0' \
            <<<"${SERVICE_JSON}")
          LIVE_IMAGE=$(gcloud run revisions describe "${LATEST_REVISION}" \
            --project="${GCP_PROJECT}" \
            --region="${GCP_REGION}" \
            --format="value(spec.containers[0].image)")
          # Cloud Run pins revisions to the image digest, so compare digests.
          # EXPECTED_DIGEST is the linux/amd64 manifest digest the build job read
          # back from the registry (scripts/image-platform-digest.sh), which is
          # also what the update step deployed by — the deploy SA cannot call
          # `gcloud artifacts docker images describe` here.
          LIVE_DIGEST="${LIVE_IMAGE##*@}"
          echo "Latest ready revision: ${LATEST_REVISION}"
          echo "Revision image: ${LIVE_IMAGE}"
          echo "Expected digest: ${EXPECTED_DIGEST}"
          echo "Traffic to revision: ${PERCENT}%"
          if [ -z "${EXPECTED_DIGEST}" ] || [ "${LIVE_DIGEST}" != "${EXPECTED_DIGEST}" ]; then
            echo "::error::Latest ready revision digest (${LIVE_DIGEST}) does not match ${EXPECTED_IMAGE} (${EXPECTED_DIGEST})"
            exit 1
          fi
          if [ "${PERCENT}" != "100" ]; then
            echo "::error::Latest ready revision is serving ${PERCENT}% of traffic, expected 100%"
            exit 1
          fi
          echo "url=${SERVICE_URL}" >> "$GITHUB_OUTPUT"

      # /status alone proves only that Express started. Security updates
      # auto-merge and deploy with nobody watching, so drive the public surface a
      # dependency bump can break: OAuth metadata, /register, /authorize -> Xero,
      # the JWT verifier on /mcp, /callback. No credentials; never reaches Xero.
      - name: Smoke test the live service
        id: smoke
        env:
          SERVICE_URL: ${{ steps.verify.outputs.url }}
        # One retry before rolling back, so a transient network blip on the
        # runner doesn't revert a good security fix.
        run: |
          if ! node scripts/smoke-deploy.mjs "${SERVICE_URL}"; then
            echo "::warning::Smoke test failed; retrying once in 20s before rolling back."
            sleep 20
            node scripts/smoke-deploy.mjs "${SERVICE_URL}"
          fi

      # Only when the new revision actually took traffic (update succeeded) and a
      # later check failed; if the revision never became ready, Cloud Run already
      # left traffic on the old one. Redeploys the previous IMAGE rather than
      # pinning traffic with update-traffic --to-revisions: a pin would leave
      # every later deploy's revision at 0% and fail the 100%-traffic check above.
      # PREV_IMAGE is the previous revision's own image reference, which Cloud Run
      # stores pinned to the digest it actually ran (…@sha256:…, the same field
      # Verify reads), so this redeploys exactly that image whether the previous
      # deploy went out by tag or by digest. No registry lookup, no Docker auth.
      - name: Roll back to the previous image
        id: rollback
        if: ${{ failure() && steps.update.outcome == 'success' && steps.prev.outputs.image != '' }}
        env:
          PREV_IMAGE: ${{ steps.prev.outputs.image }}
        run: |
          echo "::warning::Rolling ${SERVICE_NAME} back to ${PREV_IMAGE}"
          gcloud run services update "${SERVICE_NAME}" \
            --project="${GCP_PROJECT}" \
            --region="${GCP_REGION}" \
            --image="${PREV_IMAGE}" \
            --quiet
          SERVICE_URL=$(gcloud run services describe "${SERVICE_NAME}" \
            --project="${GCP_PROJECT}" \
            --region="${GCP_REGION}" \
            --format=json | jq -r '((.spec.template.spec.containers[0].env // []) | map(select(.name == "PUBLIC_URL")) | .[0].value) // .status.url')
          if ! node scripts/smoke-deploy.mjs "${SERVICE_URL}"; then
            echo "::error::Rolled back to ${PREV_IMAGE}, but the smoke test still fails. Manual attention needed."
            exit 1
          fi
          echo "::error::Deploy failed its checks and was rolled back to ${PREV_IMAGE}."

      - name: Rollout summary
        if: always()
        env:
          IMAGE: ${{ needs.build-and-push.outputs.registry }}@${{ needs.build-and-push.outputs.digest }}
          TAG_IMAGE: ${{ needs.build-and-push.outputs.image }}
          JOB_STATUS: ${{ job.status }}
          SMOKE: ${{ steps.smoke.outcome }}
          ROLLBACK: ${{ steps.rollback.outcome }}
          PREV_IMAGE: ${{ steps.prev.outputs.image }}
        run: |
          {
            echo "## Rollout"
            echo ""
            echo "- **Service:** \`${SERVICE_NAME}\`"
            echo "- **Image:** \`${TAG_IMAGE}\`"
            echo "- **Deployed by digest:** \`${IMAGE}\`"
            echo "- **Smoke test:** ${SMOKE}"
            if [ "${ROLLBACK}" != "skipped" ]; then
              echo "- **Rolled back to:** \`${PREV_IMAGE}\` (${ROLLBACK})"
            fi
            echo "- **Status:** ${JOB_STATUS}"
          } >> "$GITHUB_STEP_SUMMARY"
